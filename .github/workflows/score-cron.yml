name: Score Ingest and Update

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * 4,5,6,0'
  workflow_dispatch:

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger ingest
        run: |
          echo "Calling ingest at $(date -u)"
          curl -sf --max-time 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://disc-golf-fantasy-ui.vercel.app/api/cron/ingest" | head -c 500
          echo ""

      - name: Wait 30s
        run: sleep 30

      - name: Trigger score
        run: |
          echo "Calling score at $(date -u)"
          curl -sf --max-time 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://disc-golf-fantasy-ui.vercel.app/api/cron/score" | head -c 300
          echo ""
